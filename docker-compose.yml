version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: typing_game_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: typing_game
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: typing_game_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/typing_game
      JWT_SECRET: super-secret-typing-game-key-2026
    depends_on:
      - postgres

volumes:
  pgdata:
